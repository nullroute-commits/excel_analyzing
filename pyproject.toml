[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-analyzing"
dynamic = ["version"]
description = "Analyze Excel workbooks like databases with sheets as tables"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Excel Analyzing Team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "pydantic>=2.11.0",
    "sqlalchemy>=2.0.43",
    "psycopg2-binary>=2.9.10",
    "django>=5.2.0",
    "djangorestframework>=3.16.0",
    "python-dotenv>=1.1.1",
    "pydantic-settings>=2.10.0",
    "click>=8.2.1",
    "rich>=14.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "pytest-django>=4.11.1",
    "pytest-playwright>=0.7.0",
    "black>=25.0.0",
    "flake8>=7.2.0",
    "isort>=5.13.0",
    "mypy>=1.14.0",
    "pre-commit>=4.1.0",
    "tox>=4.26.0",
    "django-extensions>=4.1.0",
]
test = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "pytest-django>=4.11.1",
    "factory-boy>=3.3.0",
]
prod = [
    "gunicorn>=23.1.0",
    "whitenoise>=6.8.2",
]

[project.scripts]
excel-analyze = "excel_analyzing.cli:main"

[tool.setuptools_scm]
write_to = "excel_analyzing/_version.py"

[tool.setuptools.packages.find]
include = ["excel_analyzing*"]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    "migrations",
]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "excel_analyzing.web.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]
addopts = "--cov=excel_analyzing --cov-report=term-missing --cov-report=html --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "regression: Regression tests",
    "security: Security tests",
    "performance: Performance tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.coverage.run]
source = ["excel_analyzing"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/venv/*",
    "*/env/*",
    "setup.py",
    "manage.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]