name: Security Testing Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scans daily
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan to run'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - dependency
        - static
        - dynamic
        - secrets

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Dependency vulnerability scanning
  dependency-security:
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'dependency' || github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == ''
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety pip-audit cyclonedx-bom
    
    - name: Generate SBOM (Software Bill of Materials)
      run: |
        pip install -r requirements.txt
        cyclonedx-py -r requirements.txt -o sbom.json
    
    - name: Run Safety check
      run: |
        safety check --json --output safety-report.json || true
        safety check --short-report || true
    
    - name: Run pip-audit
      run: |
        pip-audit --format=json --output=pip-audit-report.json || true
        pip-audit --desc || true
    
    - name: Check for known vulnerabilities in npm packages (if any)
      run: |
        if [ -f "package.json" ]; then
          npm audit --audit-level moderate --json > npm-audit-report.json || true
        fi
    
    - name: Upload dependency security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: dependency-security-reports
        path: |
          safety-report.json
          pip-audit-report.json
          npm-audit-report.json
          sbom.json

  # Static application security testing
  static-security:
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'static' || github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == ''
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install static analysis tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit semgrep dlint
        pip install -r requirements-dev.txt
    
    - name: Run Bandit security scan
      run: |
        bandit -r excel_analyzing/ -f json -o bandit-report.json -ll || true
        bandit -r excel_analyzing/ -f txt -o bandit-report.txt -ll || true
        echo "Bandit scan completed"
    
    - name: Run Semgrep security scan
      run: |
        semgrep --config=auto excel_analyzing/ --json --output=semgrep-report.json || true
        semgrep --config=p/python excel_analyzing/ --json --output=semgrep-python.json || true
        semgrep --config=p/django excel_analyzing/ --json --output=semgrep-django.json || true
        echo "Semgrep scan completed"
    
    - name: Run Dlint (Django linter) if Django is used
      run: |
        if [ -f "manage.py" ]; then
          flake8 --select=DL excel_analyzing/ > dlint-report.txt || true
        fi
    
    - name: Run custom security tests
      run: |
        python -m pytest tests/security/ -v --tb=short --junitxml=security-tests.xml || true
    
    - name: Check for hardcoded secrets
      run: |
        # Simple regex-based secret detection
        grep -r -n -E "(password|passwd|pwd|secret|key|token|api_key)\s*=\s*['\"][^'\"]{8,}" excel_analyzing/ > potential-secrets.txt || true
        grep -r -n -E "-----BEGIN.*PRIVATE KEY-----" excel_analyzing/ >> potential-secrets.txt || true
    
    - name: Upload static security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: static-security-reports
        path: |
          bandit-report.json
          bandit-report.txt
          semgrep-report.json
          semgrep-python.json
          semgrep-django.json
          dlint-report.txt
          security-tests.xml
          potential-secrets.txt

  # Secret scanning
  secret-scanning:
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'secrets' || github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == ''
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for comprehensive scanning
    
    - name: Install secret scanning tools
      run: |
        # Install gitleaks
        wget https://github.com/zricethezav/gitleaks/releases/latest/download/gitleaks_8.18.0_linux_x64.tar.gz
        tar -xzf gitleaks_8.18.0_linux_x64.tar.gz
        chmod +x gitleaks
        sudo mv gitleaks /usr/local/bin/
        
        # Install truffleHog
        pip install truffleHog3
    
    - name: Run gitleaks scan
      run: |
        gitleaks detect --source . --report-format json --report-path gitleaks-report.json || true
        gitleaks detect --source . --report-format csv --report-path gitleaks-report.csv || true
    
    - name: Run truffleHog scan
      run: |
        trufflehog3 --format json --output trufflehog-report.json . || true
    
    - name: Check for common secret patterns
      run: |
        echo "Checking for common secret patterns..."
        # AWS keys
        grep -r -n -E "AKIA[0-9A-Z]{16}" . --exclude-dir=.git > secret-patterns.txt || true
        # API keys
        grep -r -n -E "api[_-]?key['\"]?\s*[:=]\s*['\"][a-zA-Z0-9]{20,}" . --exclude-dir=.git >> secret-patterns.txt || true
        # Database URLs
        grep -r -n -E "(postgres|mysql|mongodb)://[^:]+:[^@]+@" . --exclude-dir=.git >> secret-patterns.txt || true
        # Generic secrets
        grep -r -n -E "secret['\"]?\s*[:=]\s*['\"][a-zA-Z0-9]{10,}" . --exclude-dir=.git >> secret-patterns.txt || true
    
    - name: Upload secret scanning reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: secret-scanning-reports
        path: |
          gitleaks-report.json
          gitleaks-report.csv
          trufflehog-report.json
          secret-patterns.txt

  # Dynamic application security testing
  dynamic-security:
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'dynamic' || github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == ''
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: excel_analyzing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install application dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Start application for testing
      run: |
        python manage.py migrate
        python manage.py collectstatic --noinput
        python manage.py runserver 0.0.0.0:8000 &
        sleep 10
      env:
        ENVIRONMENT: test
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/excel_analyzing_test
        DEBUG: "False"
        SECRET_KEY: "test-key-for-security-testing-only"
    
    - name: Install OWASP ZAP
      run: |
        wget https://github.com/zaproxy/zaproxy/releases/download/v2.14.0/ZAP_2_14_0_unix.sh
        chmod +x ZAP_2_14_0_unix.sh
        sudo ./ZAP_2_14_0_unix.sh -q
    
    - name: Run OWASP ZAP baseline scan
      run: |
        /opt/zaproxy/zap.sh -cmd -quickurl http://localhost:8000 -quickout zap-baseline-report.html || true
    
    - name: Run OWASP ZAP API scan
      run: |
        # Generate OpenAPI spec if available
        if [ -f "openapi.yaml" ]; then
          /opt/zaproxy/zap.sh -cmd -openapifile openapi.yaml -openapiurl http://localhost:8000 || true
        fi
    
    - name: Run custom security integration tests
      run: |
        python -m pytest tests/security/ -k "integration" -v --tb=short || true
      env:
        BASE_URL: http://localhost:8000
    
    - name: Upload dynamic security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: dynamic-security-reports
        path: |
          zap-baseline-report.html
          zap-api-report.html

  # Container security scanning
  container-security:
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == ''
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t excel-analyzing:security-test .
    
    - name: Install container security tools
      run: |
        # Install Trivy
        wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.48.1_Linux-64bit.tar.gz
        tar zxvf trivy_0.48.1_Linux-64bit.tar.gz
        chmod +x trivy
        sudo mv trivy /usr/local/bin/
    
    - name: Run Trivy vulnerability scan
      run: |
        trivy image --format json --output trivy-report.json excel-analyzing:security-test || true
        trivy image --format table --output trivy-report.txt excel-analyzing:security-test || true
    
    - name: Run Docker security benchmark
      run: |
        # Install docker-bench-security
        git clone https://github.com/docker/docker-bench-security.git
        cd docker-bench-security
        sudo sh docker-bench-security.sh -l docker-bench-report.log || true
    
    - name: Upload container security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: container-security-reports
        path: |
          trivy-report.json
          trivy-report.txt
          docker-bench-security/docker-bench-report.log

  # Security reporting and notification
  security-report:
    runs-on: ubuntu-latest
    needs: [dependency-security, static-security, secret-scanning, dynamic-security, container-security]
    if: always()
    
    steps:
    - name: Download all security reports
      uses: actions/download-artifact@v3
    
    - name: Consolidate security findings
      run: |
        mkdir -p security-summary
        echo "# Security Scan Summary" > security-summary/report.md
        echo "Generated on: $(date)" >> security-summary/report.md
        echo "" >> security-summary/report.md
        
        echo "## Scan Results" >> security-summary/report.md
        echo "- Dependency Security: ${{ needs.dependency-security.result }}" >> security-summary/report.md
        echo "- Static Security: ${{ needs.static-security.result }}" >> security-summary/report.md
        echo "- Secret Scanning: ${{ needs.secret-scanning.result }}" >> security-summary/report.md
        echo "- Dynamic Security: ${{ needs.dynamic-security.result }}" >> security-summary/report.md
        echo "- Container Security: ${{ needs.container-security.result }}" >> security-summary/report.md
        
        # Count critical findings
        echo "" >> security-summary/report.md
        echo "## Critical Findings" >> security-summary/report.md
        
        # Process Bandit results
        if [ -f "static-security-reports/bandit-report.json" ]; then
          high_issues=$(cat static-security-reports/bandit-report.json | jq '.results | map(select(.issue_severity == "HIGH")) | length' || echo "0")
          echo "- Bandit High Severity Issues: $high_issues" >> security-summary/report.md
        fi
        
        # Process Safety results
        if [ -f "dependency-security-reports/safety-report.json" ]; then
          vulnerabilities=$(cat dependency-security-reports/safety-report.json | jq '.vulnerabilities | length' || echo "0")
          echo "- Known Vulnerabilities: $vulnerabilities" >> security-summary/report.md
        fi
        
        # Process secret scanning results
        if [ -f "secret-scanning-reports/gitleaks-report.json" ]; then
          secrets=$(cat secret-scanning-reports/gitleaks-report.json | jq 'length' || echo "0")
          echo "- Potential Secrets Found: $secrets" >> security-summary/report.md
        fi
    
    - name: Upload consolidated security report
      uses: actions/upload-artifact@v3
      with:
        name: security-summary
        path: security-summary/
    
    - name: Create security issue for critical findings
      if: github.event_name == 'schedule'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = 'security-summary/report.md';
          if (fs.existsSync(path)) {
            const report = fs.readFileSync(path, 'utf8');
            // Only create issue if there are critical findings
            if (report.includes('High Severity') || report.includes('Vulnerabilities: [1-9]')) {
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Security Scan Alert - ${new Date().toISOString().split('T')[0]}`,
                body: report,
                labels: ['security', 'urgent']
              });
            }
          }
    
    - name: Notify security team
      if: failure() && github.event_name == 'schedule'
      run: |
        echo "Security scan failed - notifications should be sent to security team"
        # Add actual notification logic here (Slack, email, etc.)