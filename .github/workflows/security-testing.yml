name: Security Testing Pipeline

on:
  push:
    branches: [ main, develop, security-test-suite ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily security scans at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - dependency
          - sast
          - secrets
          - container

env:
  PYTHON_VERSION: '3.12'

jobs:
  dependency-scanning:
    name: 🔍 Dependency Vulnerability Scanning
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'dependency' || github.event.inputs.scan_type == '' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          
      - name: Run Safety check (Python packages)
        run: |
          echo "🔍 Running Safety check for known vulnerabilities..."
          safety check --json --output safety-report.json || true
          
      - name: Run pip-audit (Package vulnerability audit)
        run: |
          echo "🔍 Running pip-audit for package vulnerabilities..."
          pip install pip-audit
          pip-audit --format=json --output=pip-audit-report.json || true
          
      - name: Check for outdated packages
        run: |
          echo "📦 Checking for outdated packages..."
          pip list --outdated --format=json > outdated-packages.json || true
          
      - name: Upload dependency scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-results
          path: |
            safety-report.json
            pip-audit-report.json
            outdated-packages.json
          retention-days: 30

  static-analysis:
    name: 🔬 Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'sast' || github.event.inputs.scan_type == '' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] semgrep
          
      - name: Run Bandit SAST scan
        run: |
          echo "🔍 Running Bandit security linting..."
          bandit -r excel_analyzing/ -f json -o bandit-report.json || true
          bandit -r excel_analyzing/ -f txt || true
          
      - name: Run Semgrep analysis
        run: |
          echo "🔍 Running Semgrep security analysis..."
          semgrep --config=auto --json --output=semgrep-report.json excel_analyzing/ || true
          
      - name: Upload SAST results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-scan-results
          path: |
            bandit-report.json
            semgrep-report.json
          retention-days: 30

  secret-scanning:
    name: 🔑 Secret Scanning
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'secrets' || github.event.inputs.scan_type == '' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for thorough secret scanning
          
      - name: Run TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified --json
          
      - name: Install and run detect-secrets
        run: |
          pip install detect-secrets
          echo "🔍 Running detect-secrets scan..."
          detect-secrets scan --all-files --baseline .secrets.baseline || true
          detect-secrets audit .secrets.baseline || true

  security-tests:
    name: 🧪 Security Test Suite
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == '' }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_excel_analyzing
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
          
      - name: Run security tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_excel_analyzing
          DJANGO_SETTINGS_MODULE: excel_analyzing.web.settings.test
        run: |
          echo "🧪 Running security test suite..."
          python -m pytest tests/security/ -v --tb=short --cov=excel_analyzing --cov-report=xml
          
      - name: Upload security test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: |
            coverage.xml
            .coverage
          retention-days: 30

  container-security:
    name: 🐳 Container Security Scanning
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'container' || github.event.inputs.scan_type == '' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Docker image
        run: |
          docker build -t excel-analyzing:test .
          
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'excel-analyzing:test'
          format: 'json'
          output: 'trivy-report.json'
          
      - name: Run Hadolint (Dockerfile linting)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: json
          output-file: hadolint-report.json
          
      - name: Upload container scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-scan-results
          path: |
            trivy-report.json
            hadolint-report.json
          retention-days: 30

  security-reporting:
    name: 📊 Security Report Aggregation
    runs-on: ubuntu-latest
    needs: [dependency-scanning, static-analysis, secret-scanning, security-tests, container-security]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download all security scan results
        uses: actions/download-artifact@v4
        with:
          path: security-reports/
          
      - name: Generate security summary report
        run: |
          echo "# 🛡️ Security Scan Summary Report" > security-summary.md
          echo "## Scan Date: $(date)" >> security-summary.md
          echo "" >> security-summary.md
          
          # Check if artifacts exist and generate summary
          if [ -d "security-reports/dependency-scan-results" ]; then
            echo "## 📦 Dependency Scanning" >> security-summary.md
            echo "- Safety scan completed" >> security-summary.md
            echo "- pip-audit completed" >> security-summary.md
            echo "" >> security-summary.md
          fi
          
          if [ -d "security-reports/sast-scan-results" ]; then
            echo "## 🔬 Static Analysis" >> security-summary.md
            echo "- Bandit SAST scan completed" >> security-summary.md
            echo "- Semgrep analysis completed" >> security-summary.md
            echo "" >> security-summary.md
          fi
          
          if [ -d "security-reports/security-test-results" ]; then
            echo "## 🧪 Security Tests" >> security-summary.md
            echo "- Security test suite executed" >> security-summary.md
            echo "" >> security-summary.md
          fi
          
          if [ -d "security-reports/container-scan-results" ]; then
            echo "## 🐳 Container Security" >> security-summary.md
            echo "- Trivy vulnerability scan completed" >> security-summary.md
            echo "- Hadolint Dockerfile analysis completed" >> security-summary.md
            echo "" >> security-summary.md
          fi
          
          echo "## 📋 Recommendations" >> security-summary.md
          echo "1. Review all high and critical vulnerabilities" >> security-summary.md
          echo "2. Update dependencies with known security fixes" >> security-summary.md
          echo "3. Address any failing security tests" >> security-summary.md
          echo "4. Validate container security configurations" >> security-summary.md
          
          cat security-summary.md
          
      - name: Upload security summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary-report
          path: |
            security-summary.md
            security-reports/
          retention-days: 90
          
      - name: Comment PR with security summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('security-summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });