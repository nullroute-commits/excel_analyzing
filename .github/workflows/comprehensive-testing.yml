name: Comprehensive Testing Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*', 'test/*' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run comprehensive tests nightly
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/excel_analyzing_test

jobs:
  # Quick validation tests that run on every push
  quick-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11, 3.12]
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: excel_analyzing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Run linting
      run: |
        black --check excel_analyzing/
        flake8 excel_analyzing/
        isort --check-only excel_analyzing/
    
    - name: Run type checking
      run: |
        mypy excel_analyzing/ --ignore-missing-imports
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short --durations=10
        
    - name: Upload unit test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: unit-test-results-${{ matrix.python-version }}
        path: |
          .coverage
          htmlcov/

  # Integration tests - more comprehensive but slower
  integration-tests:
    runs-on: ubuntu-latest
    needs: quick-tests
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: excel_analyzing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:6
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Set up test database
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d excel_analyzing_test -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
    
    - name: Run integration tests
      env:
        ENVIRONMENT: test
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest tests/integration/ -v --tb=short --durations=10 --cov=excel_analyzing --cov-append
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: |
          .coverage
          htmlcov/
          test-results/

  # Security tests
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit semgrep
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Run dependency security check
      run: |
        safety check --json --output safety-report.json || true
    
    - name: Run static security analysis
      run: |
        bandit -r excel_analyzing/ -f json -o bandit-report.json || true
    
    - name: Run Semgrep security scan
      run: |
        semgrep --config=auto excel_analyzing/ --json --output=semgrep-report.json || true
    
    - name: Run security tests
      run: |
        pytest tests/security/ -v --tb=short --durations=10
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json
          semgrep-report.json

  # Performance tests - run less frequently
  performance-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[performance]')
    timeout-minutes: 45
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: excel_analyzing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install pytest-benchmark pytest-xdist
        pip install -e .
    
    - name: Run performance tests
      run: |
        pytest tests/performance/ -v --tb=short --durations=20 -m performance --benchmark-json=benchmark-report.json
    
    - name: Upload performance reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-reports
        path: |
          benchmark-report.json
          .benchmarks/

  # Regression tests - compare with baseline
  regression-tests:
    runs-on: ubuntu-latest
    needs: [quick-tests, integration-tests]
    timeout-minutes: 25
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: excel_analyzing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Download baseline data
      uses: actions/download-artifact@v3
      with:
        name: regression-baselines
        path: tests/regression/baselines/
      continue-on-error: true
    
    - name: Run regression tests
      run: |
        pytest tests/regression/ -v --tb=short --durations=10
    
    - name: Upload regression baselines
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: regression-baselines
        path: tests/regression/baselines/

  # End-to-end tests with real browser
  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: excel_analyzing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install playwright pytest-playwright
        pip install -e .
        playwright install chromium
    
    - name: Start application server
      run: |
        python manage.py migrate
        python manage.py collectstatic --noinput
        python manage.py runserver &
        sleep 10
      env:
        ENVIRONMENT: test
    
    - name: Run E2E tests
      run: |
        pytest tests/e2e/ -v --tb=short --durations=10
      env:
        BASE_URL: http://localhost:8000
    
    - name: Upload E2E test artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-artifacts
        path: |
          test-results/
          playwright-report/

  # Generate comprehensive test report
  test-report:
    runs-on: ubuntu-latest
    needs: [quick-tests, integration-tests, security-tests, regression-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all test artifacts
      uses: actions/download-artifact@v3
    
    - name: Generate comprehensive report
      run: |
        mkdir -p test-reports
        echo "# Comprehensive Test Report" > test-reports/summary.md
        echo "Generated on: $(date)" >> test-reports/summary.md
        echo "" >> test-reports/summary.md
        
        echo "## Test Results Summary" >> test-reports/summary.md
        echo "- Unit Tests: ${{ needs.quick-tests.result }}" >> test-reports/summary.md
        echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> test-reports/summary.md
        echo "- Security Tests: ${{ needs.security-tests.result }}" >> test-reports/summary.md
        echo "- Regression Tests: ${{ needs.regression-tests.result }}" >> test-reports/summary.md
        
        # Combine coverage reports if available
        if [ -f "*/coverage.xml" ]; then
          echo "## Coverage Report" >> test-reports/summary.md
          echo "Coverage reports available in artifacts" >> test-reports/summary.md
        fi
    
    - name: Upload comprehensive report
      uses: actions/upload-artifact@v3
      with:
        name: comprehensive-test-report
        path: test-reports/
    
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = 'test-reports/summary.md';
          if (fs.existsSync(path)) {
            const summary = fs.readFileSync(path, 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
          }

  # Deploy staging environment for testing
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [quick-tests, integration-tests, security-tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add actual deployment commands here
    
    - name: Run smoke tests on staging
      run: |
        echo "Running smoke tests on staging..."
        # Add smoke test commands here
    
    - name: Notify deployment status
      run: |
        echo "Staging deployment completed successfully"