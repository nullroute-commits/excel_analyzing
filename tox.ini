[tox]
envlist = py39,py310,py311,py312,lint,docs,security,integration,regression,performance
skipsdist = False

[testenv]
deps = 
    -r{toxinidir}/requirements-dev.txt
commands = 
    pytest tests/unit/ {posargs}
setenv =
    ENVIRONMENT = test
    DATABASE_URL = sqlite:///test.db

[testenv:integration]
deps = 
    -r{toxinidir}/requirements-dev.txt
commands = 
    pytest tests/integration/ -v {posargs}
setenv =
    ENVIRONMENT = test
    DATABASE_URL = postgresql://postgres:postgres@localhost:5432/excel_analyzing_test

[testenv:regression]
deps = 
    -r{toxinidir}/requirements-dev.txt
commands = 
    pytest tests/regression/ -v {posargs}
setenv =
    ENVIRONMENT = test
    DATABASE_URL = sqlite:///test.db

[testenv:security]
deps = 
    bandit
    safety
    -r{toxinidir}/requirements-dev.txt
commands = 
    pytest tests/security/ -v {posargs}
    bandit -r excel_analyzing/
    safety check

[testenv:performance]
deps = 
    -r{toxinidir}/requirements-dev.txt
    pytest-benchmark
commands = 
    pytest tests/performance/ -v --benchmark-json=benchmark.json {posargs}
setenv =
    ENVIRONMENT = test
    DATABASE_URL = sqlite:///test.db

[testenv:e2e]
deps = 
    -r{toxinidir}/requirements-dev.txt
    playwright
    pytest-playwright
commands = 
    playwright install chromium
    pytest tests/e2e/ -v {posargs}
setenv =
    ENVIRONMENT = test
    DATABASE_URL = postgresql://postgres:postgres@localhost:5432/excel_analyzing_test

[testenv:all-tests]
deps = 
    -r{toxinidir}/requirements-dev.txt
    pytest-benchmark
    playwright
    pytest-playwright
commands = 
    pytest tests/ -v --tb=short {posargs}
setenv =
    ENVIRONMENT = test
    DATABASE_URL = sqlite:///test.db

[testenv:lint]
deps = 
    black
    flake8
    mypy
    isort
commands = 
    black --check excel_analyzing/
    flake8 excel_analyzing/
    isort --check-only excel_analyzing/
    mypy excel_analyzing/ --ignore-missing-imports

[testenv:docs]
deps = 
    sphinx
    sphinx-rtd-theme
    sphinx-autodoc-typehints
commands = 
    sphinx-build -b html docs/ docs/_build/html

[testenv:coverage]
deps = 
    -r{toxinidir}/requirements-dev.txt
    coverage
commands = 
    coverage run -m pytest tests/unit/ tests/integration/
    coverage report --show-missing
    coverage html

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    .venv,
    migrations,