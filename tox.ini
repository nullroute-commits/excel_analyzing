[tox]
envlist = py39,py310,py311,py312,lint,docs
skipsdist = False

[testenv]
deps = 
    -r{toxinidir}/requirements-dev.txt
commands = 
    pytest {posargs}
setenv =
    ENVIRONMENT = test
    DATABASE_URL = sqlite:///test.db

[testenv:lint]
deps = 
    black
    flake8
    mypy
    isort
commands = 
    black --check excel_analyzing/
    flake8 excel_analyzing/
    isort --check-only excel_analyzing/
    mypy excel_analyzing/ --ignore-missing-imports

[testenv:docs]
deps = 
    sphinx
    sphinx-rtd-theme
    sphinx-autodoc-typehints
commands = 
    sphinx-build -b html docs/ docs/_build/html

[testenv:security]
deps = 
    bandit
    safety
commands = 
    bandit -r excel_analyzing/
    safety check

[testenv:coverage]
deps = 
    -r{toxinidir}/requirements-dev.txt
    coverage
commands = 
    coverage run -m pytest
    coverage report
    coverage html

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    .venv,
    migrations,